<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>升温游戏</title>
<link rel="manifest" href="manifest.json">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--card-bg:#141420;--gold:#c9a96e;--gold-dim:rgba(201,169,110,0.5);--red:#8b3a3a;--red-bright:#b84545;--text:#e8e0d5;--text-dim:#9a9488}
html,body{height:100%;overflow:hidden}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(139,58,58,.08) 0%,transparent 70%);pointer-events:none}
.pg{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:420px;padding:24px;min-height:100vh;min-height:100dvh}
.pg.on{display:flex}
.t1{font-size:40px;letter-spacing:.08em;color:var(--gold);margin-bottom:4px}
.t2{font-size:14px;color:var(--text-dim);margin-bottom:40px;letter-spacing:.15em}
.t3{font-size:12px;color:var(--text-dim);letter-spacing:.1em;margin-bottom:12px}
.lvs{display:flex;gap:8px;margin-bottom:40px;flex-wrap:wrap;justify-content:center}
.lb{padding:12px 18px;border:1px solid rgba(201,169,110,.3);border-radius:50px;background:transparent;color:var(--text-dim);font-size:14px;font-family:inherit;cursor:pointer;transition:all .25s}
.lb.sel{background:rgba(201,169,110,.12);border-color:var(--gold);color:var(--gold)}
.lb.s4.sel{background:rgba(139,58,58,.2);border-color:var(--red-bright);color:var(--red-bright)}
.bs{padding:16px 64px;border:none;border-radius:50px;background:linear-gradient(135deg,var(--red),var(--red-bright));color:#fff;font-size:18px;font-family:inherit;letter-spacing:.1em;cursor:pointer;transition:all .25s;box-shadow:0 4px 24px rgba(139,58,58,.3)}
.bs:active{transform:scale(.96)}
.gh{width:100%;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.li{font-size:10px;letter-spacing:.12em;color:var(--gold-dim);padding:4px 10px;border:1px solid var(--gold-dim);border-radius:50px;white-space:nowrap}
.pb{flex:1;height:2px;background:rgba(255,255,255,.08);border-radius:1px;overflow:hidden}
.pf{height:100%;background:var(--gold);transition:width .4s}
.pt{font-size:12px;color:var(--text-dim);min-width:40px;text-align:right}
.cc{font-size:11px;color:var(--text-dim);margin-bottom:16px;letter-spacing:.05em}
.cs{perspective:800px;width:100%;max-width:340px;margin-bottom:32px}
.ci{position:relative;width:100%;aspect-ratio:3/4;transition:transform .7s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.ci.fl{transform:rotateY(180deg)}
.cf{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid rgba(201,169,110,.3);background:var(--card-bg)}
.cb{background-image:repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(201,169,110,.02) 8px,rgba(201,169,110,.02) 9px),repeating-linear-gradient(-45deg,transparent,transparent 8px,rgba(201,169,110,.02) 8px,rgba(201,169,110,.02) 9px);cursor:pointer}
.cbi{font-size:36px;margin-bottom:16px;opacity:.7}
.cbt{font-size:14px;color:var(--text-dim);letter-spacing:.1em;animation:pl 2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.4}50%{opacity:1}}
.cfr{transform:rotateY(180deg)}
.cb2{font-size:10px;letter-spacing:.1em;color:var(--gold);margin-bottom:12px;padding:4px 12px;border:1px solid var(--gold-dim);border-radius:50px}
.ctt{font-size:11px;color:var(--text-dim);letter-spacing:.1em;margin-bottom:24px}
.ct{font-size:22px;line-height:1.55;text-align:center;word-break:break-word}
.cd{margin-top:24px;font-size:12px;color:var(--gold-dim);letter-spacing:.05em}
.ac{display:flex;gap:16px;width:100%;max-width:340px}
.bc,.bsk{flex:1;padding:14px;border-radius:50px;font-size:15px;font-family:inherit;cursor:pointer;transition:all .25s;letter-spacing:.05em}
.bc{background:rgba(201,169,110,.12);border:1px solid var(--gold);color:var(--gold)}
.bc:active{background:rgba(201,169,110,.25);transform:scale(.96)}
.bsk{background:transparent;border:1px solid rgba(255,255,255,.1);color:var(--text-dim)}
.bsk:active{border-color:rgba(255,255,255,.3);color:var(--text);transform:scale(.96)}
.ov{display:none;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.88);flex-direction:column;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ov.on{display:flex}
.pub{font-size:11px;letter-spacing:.18em;color:var(--red-bright);margin-bottom:20px;padding:6px 16px;border:1px solid var(--red);border-radius:50px}
.puc{background:linear-gradient(160deg,#1a1015,#1a1218);border:1px solid rgba(139,58,58,.4);border-radius:16px;padding:36px 28px;max-width:320px;width:100%;text-align:center;margin-bottom:32px;animation:su .4s}
@keyframes su{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.put{font-size:20px;line-height:1.6}
.bac{padding:14px 48px;border:1px solid var(--red);border-radius:50px;background:rgba(139,58,58,.15);color:var(--red-bright);font-size:15px;font-family:inherit;cursor:pointer;transition:all .25s}
.bac:active{background:rgba(139,58,58,.3);transform:scale(.96)}
.ei{font-size:48px;margin-bottom:20px}
.et{font-size:28px;color:var(--gold);margin-bottom:8px}
.es{font-size:14px;color:var(--text-dim);margin-bottom:40px;text-align:center;line-height:1.6}
.br{padding:16px 48px;border:1px solid var(--gold);border-radius:50px;background:transparent;color:var(--gold);font-size:16px;font-family:inherit;cursor:pointer;transition:all .25s}
.br:active{background:rgba(201,169,110,.12);transform:scale(.96)}
.lb4{border-color:rgba(139,58,58,.4)}
.lb4.sel{background:rgba(139,58,58,.2);border-color:var(--red-bright);color:var(--red-bright)}
.note{font-size:11px;color:var(--text-dim);margin-top:8px;text-align:center;font-style:italic}
.btn-custom{margin-top:16px;padding:10px 28px;border:1px solid rgba(255,255,255,.08);border-radius:50px;background:transparent;color:var(--text-dim);font-size:13px;font-family:inherit;cursor:pointer;transition:all .25s}
.btn-custom:active{background:rgba(255,255,255,.04);color:var(--text)}
.custom-list{width:100%;max-height:280px;overflow-y:auto;margin-bottom:20px}
.custom-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.03);border-radius:10px;font-size:13px}
.custom-item .ci-txt{flex:1;color:var(--text);line-height:1.4}
.custom-item .ci-lv{font-size:10px;color:var(--gold-dim);white-space:nowrap}
.custom-item .ci-del{background:none;border:none;color:var(--red-bright);font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
.custom-form{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.custom-form select,.custom-form textarea{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:var(--text);font-family:inherit;font-size:14px;padding:8px 10px}
.custom-form select option{background:#141420;color:var(--text)}
.custom-form textarea{resize:none;height:56px;line-height:1.5}
.custom-form .cf-row{display:flex;gap:8px}
.custom-form .cf-row select{flex:1}
.btn-add{padding:10px;border:none;border-radius:50px;background:rgba(201,169,110,.12);border:1px solid var(--gold-dim);color:var(--gold);font-size:14px;font-family:inherit;cursor:pointer;transition:all .25s}
.btn-add:active{background:rgba(201,169,110,.25)}
.custom-empty{font-size:13px;color:var(--text-dim);text-align:center;padding:20px}
.back-row{width:100%;margin-bottom:16px}
.btn-back{background:none;border:none;color:var(--text-dim);font-size:13px;font-family:inherit;cursor:pointer;padding:0}
</style>
</head>
<body>

<div class="pg on" id="sPg">
  <div class="t1">升温</div>
  <div class="t2">卸甲 · 唤醒 · 浅尝 · 越界</div>
  <div class="t3">选择阶段（可多选）</div>
  <div class="lvs" id="lSel">
    <button class="lb sel" data-lv="1">卸甲</button>
    <button class="lb sel" data-lv="2">唤醒</button>
    <button class="lb sel" data-lv="3">浅尝</button>
    <button class="lb lb4" data-lv="4">越界</button>
  </div>
  <div class="note">谁翻牌谁就是「主动方」</div>
  <button class="bs" onclick="go()">开 始</button>
  <button class="btn-custom" onclick="show('cPg');loadCustom()">+ 自定义牌库</button>
</div>

<div class="pg" id="gPg">
  <div class="gh">
    <div class="li" id="li">卸甲</div>
    <div class="pb"><div class="pf" id="pf" style="width:0"></div></div>
    <div class="pt" id="pt">0/0</div>
  </div>
  <div class="cc" id="cnt"></div>
  <div class="cs">
    <div class="ci" id="ci" onclick="flip()">
      <div class="cf cb"><div class="cbi">🃏</div><div class="cbt">轻触翻开</div></div>
      <div class="cf cfr" id="cFront">
        <div class="cb2" id="badge"></div>
        <div class="ctt" id="typeTag"></div>
        <div class="ct" id="ctxt"></div>
        <div class="cd" id="dir"></div>
      </div>
    </div>
  </div>
  <div class="ac" id="ac" style="display:none">
    <button class="bc" onclick="done()">完成</button>
    <button class="bsk" onclick="skip()">跳过</button>
  </div>
</div>

<div class="ov" id="pOv">
  <div class="pub">惩 罚</div>
  <div class="puc"><div class="put" id="pTx"></div></div>
  <button class="bac" onclick="accP()">接受惩罚</button>
</div>

<div class="pg" id="ePg">
  <div class="ei">🌙</div>
  <div class="et">今晚到此为止</div>
  <div class="es" id="eSt"></div>
  <button class="br" onclick="re()">再来一轮</button>
</div>

<div class="pg" id="cPg">
  <div class="back-row"><button class="btn-back" onclick="re()">← 返回</button></div>
  <div class="t3" style="margin-bottom:4px">自定义牌库</div>
  <div class="note" style="margin-bottom:16px">添加你自己的卡牌，会混入对应阶段的牌堆</div>
  <div class="custom-list" id="cList"><div class="custom-empty">还没有自定义牌</div></div>
  <div class="custom-form">
    <div class="cf-row">
      <select id="cLv"><option value="1">卸甲</option><option value="2">唤醒</option><option value="3">浅尝</option><option value="4">越界</option></select>
      <select id="cType"><option value="dare">大冒险</option><option value="truth">真心话</option></select>
      <select id="cDir"><option value="">双向</option><option value="F">翻牌人→对方</option><option value="T">对方→翻牌人</option></select>
    </div>
    <textarea id="cText" placeholder="输入卡牌内容..."></textarea>
    <button class="btn-add" onclick="addCustom()">添加</button>
  </div>
</div>

<script>
// t:'truth'|'dare'  d:'F'=翻牌人→对方 'T'=对方→翻牌人 null=双向
var CARDS={1:[],2:[],3:[],4:[]};
function A(t,c,d){return{t:t,c:c,d:d||null}}

// ═══ L1 卸甲 (48) ═══ 打破日常,重新看见对方
var L1=[
// — 看见 —
A('truth','你上次盯着TA的脸超过十秒是什么时候？现在看。说一个你之前没注意到的细节。'),
A('truth','TA今天做了一件什么小事让你心里动了一下？你当时为什么没说？'),
A('truth','你记得你第一次见到TA时TA穿什么吗？那个画面还在不在？'),
A('dare','翻牌人：捧住TA的脸。十秒——什么都不做就看着。然后告诉你刚才看到了什么你平时没看见的东西。','F'),
A('truth','TA做什么的时候你最动心？是认真做事、犯傻、还是刚睡醒？'),
A('truth','你们上一次真正接吻——不是出门前亲一下那种——是什么时候？什么感觉？'),
A('truth','TA身上有没有一个你特别喜欢但很少盯着看的位置？现在盯。'),

// — 回顾 —
A('truth','你什么时候意识到"完了我喜欢这个人"？那一秒TA在干嘛？'),
A('truth','TA为你做过最让你觉得被爱的事是什么？你告诉过TA吗？'),
A('truth','如果用一个你从来没用来形容过TA的词描述TA——是什么？'),
A('truth','你跟TA之间最好的那次接吻——在哪？什么姿势？后来发生了什么？'),
A('truth','TA身上哪个味道你最喜欢？刚起床的、洗完澡的、还是出汗的？'),
A('dare','翻牌人：让TA平躺。你俯下身——不是要亲——鼻尖离TA额头一厘米。让TA感受你呼吸。保持三十秒。','F'),
A('truth','你觉得TA现在最吸引你的东西——跟三年前一样吗？'),

// — 打破日常 —
A('truth','你觉得自己现在更像TA的什么人——恋人、室友、亲人、战友？你希望更像哪个？'),
A('truth','你们有没有一个你故意避开的话题？不是怕吵架——是觉得聊了也没用。是什么？'),
A('truth','你上一次觉得"我好想你"是什么时候——虽然TA就在你身边？'),
A('truth','你们上一次一起做跟家务和工作完全无关的事是什么？还记得开心吗？'),
A('dare','你上一次认真看TA的脸超过十秒是什么时候？现在做。看完了告诉TA你看到了什么变化——好的和不好的。'),
A('dare','放下手机。两个人并排躺着。手牵手。不许说话。五分钟。谁先说话谁答应对方一件事。'),
A('dare','从背后抱住TA。不是要开始什么——只是抱着。下巴搁在TA肩上。直到你觉得TA的呼吸节奏变了——然后告诉TA变在哪里。'),

// — 触碰 —
A('dare','握住TA一只手。翻过来手心朝上。用指尖顺着TA的掌纹走一遍。找到一条你从来没注意过的线。','F'),
A('dare','帮TA脱掉袜子。找到脚上那个最常被磨到的地方。用拇指轻轻按。问TA疼不疼。','F'),
A('dare','站到TA背后。把手放在TA肩上——不是按摩，就是放着。感受TA肩膀的温度和起伏。别说话。','F'),
A('dare','找到TA身上一个你很久没认真碰过的地方——耳朵、后腰、膝盖窝。用你最自然的方式碰一下。','F'),
A('dare','让TA躺下，头枕在你腿上。你用手指慢慢梳TA的头发。从发根到发梢。找到一根不一样颜色的头发。','F'),
A('dare','把手放在TA脸上。闭眼。像读盲文一样用指尖摸TA的额头、眉骨、鼻梁、嘴唇。假装你第一次"看见"这张脸。','F'),
A('dare','把耳朵贴到TA胸口。不说话。就听。听到心跳、呼吸、肚子里的声音都行。听到一个就说出来。','F'),
A('dare','倒一杯温水递给TA。看着TA喝完。然后问TA今天过得怎么样——认真问。认真听。不许打断。','F'),
A('dare','两个人各自写三件对方最近为你做过的让你感激的事。写完交换看。不许说话——就看着。','F'),

// — 两个人 —
A('dare','找一首你们刚在一起时听的歌。放出来。做当时你们会做的事——抱着晃、接吻、或者别的。两分钟。'),
A('dare','两个人面对面坐着，膝盖碰膝盖。闭眼。各自回到第一次接吻的地方。三十秒后同时睁眼——看对方的表情。'),
A('dare','把灯调到最暗。不许说话。你们只能看到对方的轮廓。做任何你在亮光下不好意思但一直想做的事。两分钟。'),
A('dare','两个人分开站到房间最远两端。闭眼。同时朝对方走——步子越小越好。觉得够近了就停。然后睁眼。看看你们的距离。'),
A('dare','翻牌人：把你的手机给TA。让TA用你手机给你拍一张——不许修不许删。你看那张照片里的自己——说一个优点。','F'),
A('dare','翻牌人：走到TA面前。不许想——做你第一反应想对TA做的那件温柔的事。做完告诉TA你那一秒在想什么。','F'),
A('dare','你们俩互换一件身上正穿着的东西——眼镜、发圈、外套。接下来穿着对方的东西继续翻牌。'),
A('dare','翻牌人：给对方发一条微信。内容是——你脑子里现在蹦出来的第一句话。不许编辑。不许撤回。发完把手机给TA看。','F'),
A('truth','TA有没有一个你已经很久没看到的特质——比如TA以前很容易被逗笑，现在不常笑了？你想念那个特质吗？'),
A('truth','如果用一个动词来描述你现在对TA的感觉——不是爱、不是喜欢——是什么动词？'),
A('dare','翻牌人：找一件TA今天穿的衣服。把它慢慢叠好——慢到TA注意到你在干什么。放在床头。然后告诉TA你为什么选了这件。','F'),
A('dare','两个人各自拿一张纸——或用手机备忘录。写下对方最近为你做过的三件让你心动的小事。交换看。不许说话补充。'),
A('dare','翻牌人：给TA倒一杯温水，递给TA。看着TA喝完。然后问TA——今天有什么事是你想聊但没说出口的？认真问，认真听。不许打断。','F'),
A('truth','你们之间有没有一件你一直想做但不好意思主动的事？不用说出来是什么——现在拉着TA的手去那个方向。'),
A('dare','翻牌人：让TA闭眼。你从房间另一端走过来——每走一步说一件你喜欢TA的地方。走到TA面前的时候——最后一件凑到TA耳边说。','F'),
A('dare','翻牌人：用你的拇指轻轻擦过TA的下嘴唇。然后说一句你现在最想说的——不是情话，是实话。','F'),
A('dare','翻牌人：把TA拉进怀里——不是要做什么，就是抱着。抱到你觉得TA身体变软了为止。然后告诉TA你感觉到了TA身体哪些地方松了。','F'),
A('dare','两个人躺在床上。用同一个频率呼吸。吸气——停——呼气。谁先乱谁答应对方现在最想要的一件小事。'),
];

// ═══ L2 唤醒 (48) ═══ 身体重新敏感起来
var L2=[
// — 慢 —
A('dare','用你能做到的最慢速度——从TA手腕摸到肩膀。慢到你能感觉到皮肤上每一根细毛。','F'),
A('dare','TA闭眼。用指尖在TA背上写一个字——随便什么字。下笔越轻越好。轻到TA不确定你是不是真碰到了。TA来猜。','T'),
A('dare','你们两根食指对齐贴在一起。用你的指腹在TA指腹上极慢地画圈。感受指纹之间的摩擦力。十秒换一根手指。','F'),
A('dare','用你身上最软的地方——嘴唇内侧、耳垂、或眼睑——去碰TA身上最硬的地方——指关节、膝盖、锁骨。停在那十秒。','F'),
A('dare','掌心贴掌心。闭眼。极其缓慢地摩擦——慢到你的皮肤能感觉到对方指纹每一个凸起。不是追求热度——是追求触感。'),

// ═══ 游戏 ═══
var P_LEVEL=16;
var st={lv:[1,2,3],dk:[],i:0,f:false,c:0,s:0};
function LvName(v){return['','卸甲','唤醒','浅尝','越界'][v]}
function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}return b}
function getCustom(){try{return JSON.parse(localStorage.getItem('cpCds')||'[]')}catch(e){return[]}}
function saveCustom(arr){localStorage.setItem('cpCds',JSON.stringify(arr))}
function build(){
  var lvs=st.lv.slice().sort(function(a,b){return a-b});
  var dk=[];
  var cust=getCustom();
  for(var li=0;li<lvs.length;li++){
    var lv=lvs[li];var pool=CARDS[lv].slice();
    // mix in custom cards for this level
    for(var ci=0;ci<cust.length;ci++){if(cust[ci].l==lv)pool.push(cust[ci])}
    var draw=shuf(pool).slice(0,P_LEVEL);
    for(var di=0;di<draw.length;di++)dk.push(draw[di]);
  }
  return dk;
}
function loadCustom(){
  var cust=getCustom();
  var el=document.getElementById('cList');
  if(cust.length===0){el.innerHTML='<div class="custom-empty">还没有自定义牌，在下方添加</div>';return}
  var h='';
  for(var i=0;i<cust.length;i++){
    var c=cust[i];
    h+='<div class="custom-item"><span class="ci-lv">'+LvName(c.l)+'·'+(c.t==='truth'?'真心话':'大冒险')+'</span><span class="ci-txt">'+c.c+'</span><button class="ci-del" onclick="delCustom('+i+')">×</button></div>';
  }
  el.innerHTML=h;
}
function addCustom(){
  var lv=parseInt(document.getElementById('cLv').value);
  var t=document.getElementById('cType').value;
  var d=document.getElementById('cDir').value;
  var c=document.getElementById('cText').value.trim();
  if(!c)return;
  var cust=getCustom();
  cust.push({t:t,l:lv,c:c,d:d||null});
  saveCustom(cust);
  document.getElementById('cText').value='';
  loadCustom();
}
function delCustom(i){
  var cust=getCustom();
  cust.splice(i,1);
  saveCustom(cust);
  loadCustom();
}
function show(id){
  var ps=document.querySelectorAll('.pg');
  for(var i=0;i<ps.length;i++)ps[i].classList.remove('on');
  document.getElementById(id).classList.add('on');
}
function updFront(){
  if(st.i>=st.dk.length)return;
  var c=st.dk[st.i];
  document.getElementById('badge').textContent='Lv.'+c.l+' · '+LvName(c.l);
  document.getElementById('typeTag').textContent=c.t==='truth'?'真心话':'大冒险';
  document.getElementById('ctxt').textContent=c.c;
  var d='';
  if(c.d==='F')d='翻牌人 → 对方';
  else if(c.d==='T')d='对方 → 翻牌人';
  document.getElementById('dir').textContent=d;
  var el=document.getElementById('li');
  el.textContent='Lv.'+c.l+' · '+LvName(c.l);
  var cc={1:'var(--gold-dim)',2:'var(--gold)',3:'var(--red-bright)',4:'var(--red)'};
  el.style.borderColor=cc[c.l]||'var(--gold-dim)';
  el.style.color=cc[c.l]||'var(--gold-dim)';
}
function updProg(){
  var pct=st.dk.length>0?Math.round((st.i/st.dk.length)*100):0;
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('pt').textContent=st.i+'/'+st.dk.length;
  document.getElementById('cnt').textContent=st.dk.length>0?'第 '+(st.i+1)+' / '+st.dk.length+' 张':'';
}
function go(){
  st.dk=build();if(st.dk.length===0)return;
  st.i=0;st.f=false;st.c=0;st.s=0;
  show('gPg');document.getElementById('ac').style.display='none';
  document.getElementById('pf').style.width='0%';
  document.getElementById('pt').textContent='0/'+st.dk.length;
  document.getElementById('ci').classList.remove('fl');
  updFront();updProg();
}
function flip(){if(st.f)return;st.f=true;document.getElementById('ci').classList.add('fl');document.getElementById('ac').style.display='flex';}
function nxt(){st.i++;st.f=false;updProg();if(st.i>=st.dk.length){end();return}document.getElementById('ci').classList.remove('fl');document.getElementById('ac').style.display='none';updFront();}
function done(){st.c++;nxt()}
function skip(){st.s++;var p=PUN[Math.floor(Math.random()*PUN.length)];document.getElementById('pTx').textContent=p;document.getElementById('pOv').classList.add('on');}
function accP(){document.getElementById('pOv').classList.remove('on');nxt()}
function end(){show('ePg');document.getElementById('eSt').innerHTML='完成了 <b>'+st.c+'</b> 张牌<br>跳过了 <b>'+st.s+'</b> 次——有乖乖受罚吧？';}
function re(){show('sPg')}

var bs=document.querySelectorAll('.lb');
for(var i=0;i<bs.length;i++){
  bs[i].addEventListener('click',function(){
    var v=parseInt(this.dataset.lv);
    this.classList.toggle('sel');
    if(this.classList.contains('sel')){if(st.lv.indexOf(v)===-1)st.lv.push(v)}
    else{var idx=st.lv.indexOf(v);if(idx!==-1)st.lv.splice(idx,1)}
    if(st.lv.length===0){this.classList.add('sel');st.lv.push(v)}
  });
}
