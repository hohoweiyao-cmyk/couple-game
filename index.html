<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>升温游戏</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1210">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1210;--card1:#2c1d16;--card2:#211410;--gold:#d8b08c;--gold-dim:rgba(216,176,140,.45);--rose:#e8a8a2;--rose-deep:#c97a72;--ember:#e09a64;--red:#a04a48;--red-bright:#c25a55;--text:#f4e9e1;--text-dim:#a8918a}
html,body{height:100%;overflow:hidden}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 90% 55% at 50% 18%,rgba(224,154,100,.13) 0%,transparent 65%),radial-gradient(ellipse 80% 50% at 50% 105%,rgba(201,122,114,.10) 0%,transparent 70%);pointer-events:none;animation:flk 7s ease-in-out infinite}
@keyframes flk{0%,100%{opacity:.8}40%{opacity:1}60%{opacity:.88}}
.embers i{position:fixed;bottom:-12px;width:4px;height:4px;border-radius:50%;background:rgba(224,154,100,.55);filter:blur(.5px);animation:rise linear infinite;pointer-events:none}
.embers i:nth-child(1){left:12%;animation-duration:11s;animation-delay:0s}
.embers i:nth-child(2){left:28%;animation-duration:14s;animation-delay:3s;width:3px;height:3px}
.embers i:nth-child(3){left:46%;animation-duration:10s;animation-delay:6s}
.embers i:nth-child(4){left:62%;animation-duration:15s;animation-delay:1.5s;width:3px;height:3px}
.embers i:nth-child(5){left:78%;animation-duration:12s;animation-delay:4.5s}
.embers i:nth-child(6){left:90%;animation-duration:16s;animation-delay:8s;width:2px;height:2px}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.7}50%{transform:translateY(-55vh) translateX(14px);opacity:.45}100%{transform:translateY(-108vh) translateX(-10px);opacity:0}}
.pg{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:420px;padding:24px;min-height:100vh;min-height:100dvh}
.pg.on{display:flex}
.t1{font-size:44px;letter-spacing:.12em;color:var(--rose);margin-bottom:6px;text-shadow:0 0 28px rgba(232,168,162,.35)}
.t2{font-size:13px;color:var(--text-dim);margin-bottom:36px;letter-spacing:.2em}
.t3{font-size:12px;color:var(--text-dim);letter-spacing:.1em;margin-bottom:12px}
.lvs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.lb{padding:12px 18px;border:1px solid rgba(216,176,140,.3);border-radius:50px;background:transparent;color:var(--text-dim);font-size:14px;font-family:inherit;cursor:pointer;transition:all .25s}
.lb.sel{background:rgba(224,154,100,.14);border-color:var(--ember);color:var(--ember);box-shadow:0 0 16px rgba(224,154,100,.18)}
.bs{margin-top:22px;padding:16px 64px;border:none;border-radius:50px;background:linear-gradient(135deg,var(--red),var(--rose-deep));color:#fff;font-size:18px;font-family:inherit;letter-spacing:.12em;cursor:pointer;transition:all .25s;box-shadow:0 6px 28px rgba(201,122,114,.35)}
.bs:active{transform:scale(.96)}
.gh{width:100%;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.li{font-size:10px;letter-spacing:.12em;color:var(--ember);padding:4px 10px;border:1px solid rgba(224,154,100,.5);border-radius:50px;white-space:nowrap}
.pb{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.pf{height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--rose-deep));border-radius:3px;box-shadow:0 0 10px rgba(224,154,100,.6);transition:width .5s ease}
.pt{font-size:13px;color:var(--ember);min-width:36px;text-align:right}
.dots{display:flex;gap:8px;margin-bottom:10px}
.dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.12);transition:all .4s}
.dots span.lit{background:var(--ember);box-shadow:0 0 8px rgba(224,154,100,.7)}
.cc{font-size:11px;color:var(--text-dim);margin-bottom:14px;letter-spacing:.05em}
.cs{perspective:900px;width:100%;max-width:340px;margin-bottom:28px}
.ci{position:relative;width:100%;aspect-ratio:3/4;transition:transform .75s cubic-bezier(.35,0,.18,1);transform-style:preserve-3d}
.ci.fl{transform:rotateY(180deg)}
.cf{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid rgba(216,176,140,.32);background:linear-gradient(165deg,var(--card1),var(--card2));box-shadow:0 14px 40px rgba(0,0,0,.45)}
.cf::after{content:'';position:absolute;inset:9px;border:1px solid rgba(216,176,140,.16);border-radius:12px;pointer-events:none}
.cb{cursor:pointer;background-image:radial-gradient(circle at 50% 38%,rgba(224,154,100,.10),transparent 55%),repeating-linear-gradient(45deg,transparent,transparent 9px,rgba(216,176,140,.03) 9px,rgba(216,176,140,.03) 10px)}
.cbi{font-size:36px;margin-bottom:16px;opacity:.8}
.cbt{font-size:13px;color:var(--text-dim);letter-spacing:.14em;animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.4}50%{opacity:1}}
.cfr{transform:rotateY(180deg)}
.cfr.evc{border-color:rgba(224,154,100,.6);background:linear-gradient(165deg,#33200f,#241408);box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 30px rgba(224,154,100,.12)}
.cb2{font-size:10px;letter-spacing:.1em;color:var(--ember);margin-bottom:12px;padding:4px 12px;border:1px solid rgba(224,154,100,.5);border-radius:50px}
.ctt{font-size:11px;color:var(--text-dim);letter-spacing:.1em;margin-bottom:22px}
.ct{font-size:21px;line-height:1.6;text-align:center;word-break:break-word}
.cd{margin-top:22px;font-size:12px;color:var(--gold-dim);letter-spacing:.05em}
.ac{display:flex;gap:16px;width:100%;max-width:340px;margin-bottom:14px}
.bc,.bsk{flex:1;padding:14px;border-radius:50px;font-size:15px;font-family:inherit;cursor:pointer;transition:all .25s;letter-spacing:.05em}
.bc{background:rgba(224,154,100,.14);border:1px solid var(--ember);color:var(--ember)}
.bc:active{background:rgba(224,154,100,.26);transform:scale(.96)}
.bsk{background:transparent;border:1px solid rgba(255,255,255,.1);color:var(--text-dim)}
.bsk:active{border-color:rgba(255,255,255,.3);color:var(--text);transform:scale(.96)}
.btn-quit{background:none;border:none;color:rgba(168,145,138,.6);font-size:12px;font-family:inherit;cursor:pointer;letter-spacing:.08em;padding:6px}
.ov{display:none;position:fixed;inset:0;z-index:10;background:rgba(10,6,5,.9);flex-direction:column;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ov.on{display:flex}
.pub{font-size:11px;letter-spacing:.18em;color:var(--red-bright);margin-bottom:20px;padding:6px 16px;border:1px solid var(--red);border-radius:50px}
.puc{background:linear-gradient(160deg,#2a1512,#221110);border:1px solid rgba(160,74,72,.45);border-radius:18px;padding:36px 28px;max-width:320px;width:100%;text-align:center;margin-bottom:32px;animation:su .4s}
@keyframes su{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.put{font-size:20px;line-height:1.6}
.bac{padding:14px 48px;border:1px solid var(--red);border-radius:50px;background:rgba(160,74,72,.16);color:var(--red-bright);font-size:15px;font-family:inherit;cursor:pointer;transition:all .25s}
.bac:active{background:rgba(160,74,72,.3);transform:scale(.96)}
.ub{font-size:11px;letter-spacing:.2em;color:var(--ember);margin-bottom:18px}
.ut{font-size:52px;letter-spacing:.18em;color:var(--rose);text-shadow:0 0 36px rgba(232,168,162,.5);margin-bottom:10px;animation:bloom 1s ease}
@keyframes bloom{from{opacity:0;transform:scale(.86);filter:blur(6px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
.us{font-size:13px;color:var(--text-dim);letter-spacing:.12em;margin-bottom:40px}
.bu{flex:none;padding:14px 56px}
.ei{font-size:46px;margin-bottom:20px}
.et{font-size:26px;color:var(--rose);margin-bottom:10px}
.es{font-size:14px;color:var(--text-dim);margin-bottom:40px;text-align:center;line-height:1.8}
.br{padding:16px 48px;border:1px solid var(--ember);border-radius:50px;background:transparent;color:var(--ember);font-size:16px;font-family:inherit;cursor:pointer;transition:all .25s}
.br:active{background:rgba(224,154,100,.12);transform:scale(.96)}
.lb4{border-color:rgba(160,74,72,.4)}
.lb4.sel{background:rgba(160,74,72,.18);border-color:var(--red-bright);color:var(--red-bright);box-shadow:0 0 16px rgba(194,90,85,.2)}
.note{font-size:11px;color:var(--text-dim);margin-top:8px;text-align:center;font-style:italic;line-height:1.7}
.btn-custom{margin-top:16px;padding:10px 28px;border:1px solid rgba(255,255,255,.08);border-radius:50px;background:transparent;color:var(--text-dim);font-size:13px;font-family:inherit;cursor:pointer;transition:all .25s}
.btn-custom:active{background:rgba(255,255,255,.04);color:var(--text)}
.custom-list{width:100%;max-height:280px;overflow-y:auto;margin-bottom:20px}
.custom-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.03);border-radius:10px;font-size:13px}
.custom-item .ci-txt{flex:1;color:var(--text);line-height:1.4}
.custom-item .ci-lv{font-size:10px;color:var(--gold-dim);white-space:nowrap}
.custom-item .ci-del{background:none;border:none;color:var(--red-bright);font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
.custom-form{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.custom-form select,.custom-form textarea{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:var(--text);font-family:inherit;font-size:14px;padding:8px 10px}
.custom-form select option{background:#141420;color:var(--text)}
.custom-form textarea{resize:none;height:56px;line-height:1.5}
.custom-form .cf-row{display:flex;gap:8px}
.custom-form .cf-row select{flex:1}
.btn-add{padding:10px;border:none;border-radius:50px;background:rgba(201,169,110,.12);border:1px solid var(--gold-dim);color:var(--gold);font-size:14px;font-family:inherit;cursor:pointer;transition:all .25s}
.btn-add:active{background:rgba(201,169,110,.25)}
.custom-empty{font-size:13px;color:var(--text-dim);text-align:center;padding:20px}
.back-row{width:100%;margin-bottom:16px}
.btn-back{background:none;border:none;color:var(--text-dim);font-size:13px;font-family:inherit;cursor:pointer;padding:0}
.xbox{width:100%;max-width:340px;border:1px solid rgba(184,69,69,.35);border-radius:16px;background:rgba(139,58,58,.08);padding:24px 22px;margin-bottom:28px}
.xbox p{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:12px}
.xbox p:last-child{margin-bottom:0}
.xrow{display:flex;gap:12px;width:100%;max-width:340px}
.xrow button{flex:1}
</style>
</head>
<body>

<div class="embers"><i></i><i></i><i></i><i></i><i></i><i></i></div>

<div class="pg on" id="sPg">
  <div class="t1">升温</div>
  <div class="t2">卸甲 · 唤醒 · 浅尝 · 越界</div>
  <div class="t3">选择今晚的阶段（可多选）</div>
  <div class="lvs" id="lSel">
    <button class="lb sel" data-lv="1">卸甲</button>
    <button class="lb sel" data-lv="2">唤醒</button>
    <button class="lb sel" data-lv="3">浅尝</button>
    <button class="lb lb4" data-lv="4">越界</button>
  </div>
  <div class="note">从最低的阶段开始——完成卡牌，积累温度<br>温度升满，才能走进下一阶段<br>谁翻牌谁就是「主动方」</div>
  <button class="bs" onclick="go()">点 燃</button>
  <button class="btn-custom" onclick="show('cPg');loadCustom()">+ 自定义牌库</button>
</div>

<div class="pg" id="gPg">
  <div class="gh">
    <div class="li" id="li">卸甲</div>
    <div class="pb"><div class="pf" id="pf" style="width:0"></div></div>
    <div class="pt" id="pt">0°</div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="cc" id="cnt"></div>
  <div class="cs">
    <div class="ci" id="ci" onclick="flip()">
      <div class="cf cb"><div class="cbi">🕯️</div><div class="cbt">轻触翻开</div></div>
      <div class="cf cfr" id="cFront">
        <div class="cb2" id="badge"></div>
        <div class="ctt" id="typeTag"></div>
        <div class="ct" id="ctxt"></div>
        <div class="cd" id="dir"></div>
      </div>
    </div>
  </div>
  <div class="ac" id="ac" style="display:none">
    <button class="bc" id="dnB" onclick="done()">完成</button>
    <button class="bsk" id="skB" onclick="skip()">跳过</button>
  </div>
  <button class="btn-quit" onclick="end()">今晚到此为止</button>
</div>

<div class="ov" id="uOv">
  <div class="ub">温 度 已 满</div>
  <div class="ut" id="uTx">唤醒</div>
  <div class="us">下一阶段，已经解锁</div>
  <button class="bc bu" onclick="ackU()">继 续</button>
</div>

<div class="pg" id="xPg">
  <div class="t1">越界</div>
  <div class="t2">先确认，再深入</div>
  <div class="xbox">
    <p>确认双方都是成年人、在私密空间，并且今晚都愿意进入高尺度牌组。</p>
    <p>任何一方说停就停；先约定一个安全词。录像、留痕、道具、强弱关系都必须再次确认。</p>
  </div>
  <div class="xrow">
    <button class="bsk" onclick="cancelX()">返回</button>
    <button class="bc" onclick="ackX()">确认开始</button>
  </div>
</div>

<div class="ov" id="pOv">
  <div class="pub">惩 罚</div>
  <div class="puc"><div class="put" id="pTx"></div></div>
  <button class="bac" onclick="accP()">接受惩罚</button>
</div>

<div class="pg" id="ePg">
  <div class="ei">🌙</div>
  <div class="et">今晚到此为止</div>
  <div class="es" id="eSt"></div>
  <button class="br" onclick="re()">再来一轮</button>
</div>

<div class="pg" id="cPg">
  <div class="back-row"><button class="btn-back" onclick="re()">← 返回</button></div>
  <div class="t3" style="margin-bottom:4px">自定义牌库</div>
  <div class="note" style="margin-bottom:16px">添加你自己的卡牌，会混入对应阶段的牌堆</div>
  <div class="custom-list" id="cList"><div class="custom-empty">还没有自定义牌</div></div>
  <div class="custom-form">
    <div class="cf-row">
      <select id="cLv"><option value="1">卸甲</option><option value="2">唤醒</option><option value="3">浅尝</option><option value="4">越界</option></select>
      <select id="cType"><option value="dare">大冒险</option><option value="truth">真心话</option></select>
      <select id="cDir"><option value="">双向</option><option value="F">翻牌人→对方</option><option value="T">对方→翻牌人</option></select>
    </div>
    <textarea id="cText" placeholder="输入卡牌内容..."></textarea>
    <button class="btn-add" onclick="addCustom()">添加</button>
  </div>
</div>

<script>
// t:'truth'|'dare'  d:'F'=翻牌人→对方 'T'=对方→翻牌人 null=双向
var CARDS={1:[],2:[],3:[],4:[]};
function A(t,c,d){return{t:t,c:c,d:d||null}}

// ═══ 旧版 L1（已停用，新版在 L3/L4 之后）═══
var L1_legacy=[
// — 看见 —
A('truth','你上次盯着TA的脸超过十秒是什么时候？现在看。说一个你之前没注意到的细节。'),
A('truth','TA今天做了一件什么小事让你心里动了一下？你当时为什么没说？'),
A('truth','你记得你第一次见到TA时TA穿什么吗？那个画面还在不在？'),
A('dare','翻牌人：捧住TA的脸。十秒——什么都不做就看着。然后告诉你刚才看到了什么你平时没看见的东西。','F'),
A('truth','TA做什么的时候你最动心？是认真做事、犯傻、还是刚睡醒？'),
A('truth','你们上一次真正接吻——不是出门前亲一下那种——是什么时候？什么感觉？'),
A('truth','TA身上有没有一个你特别喜欢但很少盯着看的位置？现在盯。'),

// — 回顾 —
A('truth','你什么时候意识到"完了我喜欢这个人"？那一秒TA在干嘛？'),
A('truth','TA为你做过最让你觉得被爱的事是什么？你告诉过TA吗？'),
A('truth','如果用一个你从来没用来形容过TA的词描述TA——是什么？'),
A('truth','你跟TA之间最好的那次接吻——在哪？什么姿势？后来发生了什么？'),
A('truth','TA身上哪个味道你最喜欢？刚起床的、洗完澡的、还是出汗的？'),
A('dare','翻牌人：让TA平躺。你俯下身——不是要亲——鼻尖离TA额头一厘米。让TA感受你呼吸。保持三十秒。','F'),
A('truth','你觉得TA现在最吸引你的东西——跟三年前一样吗？'),

// — 打破日常 —
A('truth','你觉得自己现在更像TA的什么人——恋人、室友、亲人、战友？你希望更像哪个？'),
A('truth','你们有没有一个你故意避开的话题？不是怕吵架——是觉得聊了也没用。是什么？'),
A('truth','你上一次觉得"我好想你"是什么时候——虽然TA就在你身边？'),
A('truth','你们上一次一起做跟家务和工作完全无关的事是什么？还记得开心吗？'),
A('dare','你上一次认真看TA的脸超过十秒是什么时候？现在做。看完了告诉TA你看到了什么变化——好的和不好的。'),
A('dare','放下手机。两个人并排躺着。手牵手。不许说话。五分钟。谁先说话谁答应对方一件事。'),
A('dare','从背后抱住TA。不是要开始什么——只是抱着。下巴搁在TA肩上。直到你觉得TA的呼吸节奏变了——然后告诉TA变在哪里。'),

// — 触碰 —
A('dare','握住TA一只手。翻过来手心朝上。用指尖顺着TA的掌纹走一遍。找到一条你从来没注意过的线。','F'),
A('dare','帮TA脱掉袜子。找到脚上那个最常被磨到的地方。用拇指轻轻按。问TA疼不疼。','F'),
A('dare','站到TA背后。把手放在TA肩上——不是按摩，就是放着。感受TA肩膀的温度和起伏。别说话。','F'),
A('dare','找到TA身上一个你很久没认真碰过的地方——耳朵、后腰、膝盖窝。用你最自然的方式碰一下。','F'),
A('dare','让TA躺下，头枕在你腿上。你用手指慢慢梳TA的头发。从发根到发梢。找到一根不一样颜色的头发。','F'),
A('dare','把手放在TA脸上。闭眼。像读盲文一样用指尖摸TA的额头、眉骨、鼻梁、嘴唇。假装你第一次"看见"这张脸。','F'),
A('dare','把耳朵贴到TA胸口。不说话。就听。听到心跳、呼吸、肚子里的声音都行。听到一个就说出来。','F'),
A('dare','倒一杯温水递给TA。看着TA喝完。然后问TA今天过得怎么样——认真问。认真听。不许打断。','F'),
A('dare','两个人各自写三件对方最近为你做过的让你感激的事。写完交换看。不许说话——就看着。','F'),

// — 两个人 —

// ═══ 游戏 ═══
var HEAT_NEED=8;      // 升满温度所需
var PER_STAGE=12;     // 每阶段抽牌数
var EV_CHANCE=0.22;   // 事件卡出现概率
var st={lv:[1,2,3],q:[],qi:0,heat:0,total:0,dk:[],i:0,f:false,c:0,s:0,x:false,mult:1,swap:0,le:false};
function LvName(v){return['','卸甲','唤醒','浅尝','越界'][v]}
function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}return b}
function getCustom(){try{return JSON.parse(localStorage.getItem('cpCds')||'[]')}catch(e){return[]}}
function saveCustom(arr){localStorage.setItem('cpCds',JSON.stringify(arr))}
function cardWithLevel(c,lv){return{t:c.t,c:c.c,d:c.d||null,l:c.l||lv}}
function buildStage(lv){
  var pool=CARDS[lv].slice();
  var cust=getCustom();
  for(var ci=0;ci<cust.length;ci++){if(cust[ci].l==lv)pool.push(cust[ci])}
  var draw=shuf(pool).slice(0,PER_STAGE);
  var dk=[];
  for(var di=0;di<draw.length;di++)dk.push(cardWithLevel(draw[di],lv));
  return dk;
}
function loadCustom(){
  var cust=getCustom();
  var el=document.getElementById('cList');
  el.innerHTML='';
  if(cust.length===0){
    var empty=document.createElement('div');
    empty.className='custom-empty';
    empty.textContent='还没有自定义牌，在下方添加';
    el.appendChild(empty);
    return;
  }
  for(var i=0;i<cust.length;i++){
    var c=cust[i];
    var item=document.createElement('div');
    var meta=document.createElement('span');
    var txt=document.createElement('span');
    var del=document.createElement('button');
    item.className='custom-item';
    meta.className='ci-lv';
    txt.className='ci-txt';
    del.className='ci-del';
    meta.textContent=LvName(c.l)+'·'+(c.t==='truth'?'真心话':'大冒险');
    txt.textContent=c.c;
    del.textContent='×';
    del.setAttribute('onclick','delCustom('+i+')');
    item.appendChild(meta);
    item.appendChild(txt);
    item.appendChild(del);
    el.appendChild(item);
  }
}
function addCustom(){
  var lv=parseInt(document.getElementById('cLv').value);
  var t=document.getElementById('cType').value;
  var d=document.getElementById('cDir').value;
  var c=document.getElementById('cText').value.trim();
  if(!c)return;
  var cust=getCustom();
  cust.push({t:t,l:lv,c:c,d:d||null});
  saveCustom(cust);
  document.getElementById('cText').value='';
  loadCustom();
}
function delCustom(i){
  var cust=getCustom();
  cust.splice(i,1);
  saveCustom(cust);
  loadCustom();
}
function show(id){
  var ps=document.querySelectorAll('.pg');
  for(var i=0;i<ps.length;i++)ps[i].classList.remove('on');
  document.getElementById(id).classList.add('on');
}
function curLv(){return st.q[st.qi]}
function isLast(){return st.qi>=st.q.length-1}
function updFront(){
  if(st.i>=st.dk.length)return;
  var c=st.dk[st.i];
  var f=document.getElementById('cFront');
  if(c.t==='event'){
    f.classList.add('evc');
    document.getElementById('badge').textContent='🕯️ 事 件';
    document.getElementById('typeTag').textContent='命运拨弄';
    document.getElementById('dir').textContent='';
  }else{
    f.classList.remove('evc');
    document.getElementById('badge').textContent='Lv.'+c.l+' · '+LvName(c.l);
    document.getElementById('typeTag').textContent=c.t==='truth'?'真心话':'大冒险';
    var d='';
    if(c.d==='F')d=st.swap>0?'对方 → 翻牌人 ⇄':'翻牌人 → 对方';
    else if(c.d==='T')d=st.swap>0?'翻牌人 → 对方 ⇄':'对方 → 翻牌人';
    document.getElementById('dir').textContent=d;
  }
  document.getElementById('ctxt').textContent=c.c;
  var el=document.getElementById('li');
  el.textContent='Lv.'+curLv()+' · '+LvName(curLv());
}
function updProg(){
  var pct=Math.min(100,Math.round(st.heat/HEAT_NEED*100));
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('pt').textContent=st.heat+'°';
  var msg;
  if(isLast()){msg='最终阶段 · 第 '+(st.i+1)+' 张';}
  else{var left=Math.max(0,HEAT_NEED-st.heat);msg='第 '+(st.i+1)+' 张 · 距下一阶段还差 '+left+'°';}
  document.getElementById('cnt').textContent=msg;
}
function drawDots(){
  var el=document.getElementById('dots');el.innerHTML='';
  for(var i=0;i<st.q.length;i++){var s=document.createElement('span');if(i<=st.qi)s.className='lit';el.appendChild(s)}
}
function resetCard(){
  st.f=false;
  document.getElementById('ci').classList.remove('fl');
  document.getElementById('ac').style.display='none';
}
function addHeat(n){
  var g=n*st.mult;st.mult=1;
  st.heat+=g;st.total+=g;updProg();
}
function loadStage(){
  st.dk=buildStage(curLv());
  if(st.dk.length===0){end();return}
  st.i=0;resetCard();drawDots();updFront();updProg();
}
function startGame(){
  st.q=st.lv.slice().sort(function(a,b){return a-b});
  st.qi=0;st.heat=0;st.total=0;st.c=0;st.s=0;st.mult=1;st.swap=0;st.le=false;
  show('gPg');loadStage();
}
function go(){if(st.lv.indexOf(4)!==-1&&!st.x){show('xPg');return}startGame()}
function ackX(){st.x=true;startGame()}
function cancelX(){show('sPg')}
function flip(){
  if(st.f)return;st.f=true;
  document.getElementById('ci').classList.add('fl');
  document.getElementById('ac').style.display='flex';
  var ev=st.dk[st.i]&&st.dk[st.i].t==='event';
  document.getElementById('skB').style.display=ev?'none':'';
  document.getElementById('dnB').textContent=ev?'收 下':'完成';
}
function maybeEvent(){
  if(EVENTS.length&&!st.le&&Math.random()<EV_CHANCE){
    var e=EVENTS[Math.floor(Math.random()*EVENTS.length)];
    st.dk.splice(st.i,0,{t:'event',c:e.c,fx:e.fx,l:curLv()});
    st.le=true;
  }else{st.le=false}
}
function applyEvent(c){
  if(c.fx==='mult2')st.mult=2;
  else if(c.fx==='heat3')addHeat(3);
  else if(c.fx==='swap2')st.swap=2;
}
function advance(){
  var c=st.dk[st.i];
  if(st.swap>0&&c&&c.t!=='event')st.swap--;
  if(!isLast()&&st.heat>=HEAT_NEED){unlock();return}
  st.i++;
  if(st.i>=st.dk.length){
    if(!isLast()){unlock()}else{end()}
    return;
  }
  maybeEvent();
  resetCard();updFront();updProg();
}
function done(){
  var c=st.dk[st.i];
  if(c.t==='event'){applyEvent(c)}
  else{st.c++;addHeat(c.t==='truth'?1:2)}
  advance();
}
function skip(){st.s++;var p=PUN[Math.floor(Math.random()*PUN.length)];document.getElementById('pTx').textContent=p;document.getElementById('pOv').classList.add('on');}
function accP(){document.getElementById('pOv').classList.remove('on');addHeat(1);advance()}
function unlock(){
  document.getElementById('uTx').textContent=LvName(st.q[st.qi+1]);
  document.getElementById('uOv').classList.add('on');
}
function ackU(){
  document.getElementById('uOv').classList.remove('on');
  st.qi++;st.heat=0;st.le=false;
  loadStage();
}
function end(){
  show('ePg');
  var reach=st.q.length?LvName(st.q[st.qi]):'';
  document.getElementById('eSt').innerHTML='完成 <b>'+st.c+'</b> 张 · 跳过 <b>'+st.s+'</b> 次<br>今晚一共升温 <b>'+st.total+'°</b>'+(reach?'<br>走到了「'+reach+'」':'');
}
function re(){st.x=false;show('sPg')}

var bs=document.querySelectorAll('.lb');
for(var i=0;i<bs.length;i++){
  bs[i].addEventListener('click',function(){
    var v=parseInt(this.dataset.lv);
    this.classList.toggle('sel');
    if(this.classList.contains('sel')){if(st.lv.indexOf(v)===-1)st.lv.push(v)}
    else{var idx=st.lv.indexOf(v);if(idx!==-1)st.lv.splice(idx,1)}
    if(st.lv.length===0){this.classList.add('sel');st.lv.push(v)}
  });
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
